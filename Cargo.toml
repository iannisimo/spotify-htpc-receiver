[package]
name = "htpc-nowplaying"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11.11", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "net", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
libloading = "0.8.9"
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"
