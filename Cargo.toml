[package]
name = "htpc-nowplaying"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
